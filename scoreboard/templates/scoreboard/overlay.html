{% load static %}<!doctype html>
<html lang="es" style="background:transparent">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <title>Overlay {{ match.code }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap">
  <!-- Estilos propios del overlay: NO se carga style.css (fondo azul de la vista pública) -->
  <link rel="stylesheet" href="{% static 'css/overlay.css' %}">
  <!--
    URLs:
      /overlay/<codigo>/                 marcador
      /overlay/<codigo>/<categoria>/     con categoría, ej. /overlay/6tadamas/6ta-damas/
      /overlay/<codigo>/preview/         simulador 9:16 para probar en la compu
    Parámetros opcionales (?):
      cat=6ta Damas   categoría      ed=4ta Edición   encabezado
      top=190         margen superior en px de un video 1080x1920
      scale=1         tamaño (ej. 0.9 / 1.1)
      logo=0          sin logo       league=0         sin "Liga de Pádel San Cayetano"
      pos=bottom      marcador abajo
  -->
</head>
<body style="background:transparent">
  <div class="ov" id="ov">
    <div class="board">
      <div class="hdr">
        <div class="logo">
          <img src="{% static 'brand/logo-liga.png' %}" alt="Liga de Pádel San Cayetano">
        </div>
        <div class="hdr-text">
          <span class="league">Liga de Pádel San Cayetano</span>
          <div class="edition-row">
            <span class="edition">{{ edition }}</span>
            <span class="cat" id="cat">{{ category }}</span>
          </div>
        </div>
        <div class="status" id="status">SET 1</div>
      </div>

      <div class="grid">
        <div class="r head">
          <div class="c-name">PAREJAS</div>
          <div class="c-set" id="h1">S1</div>
          <div class="c-set" id="h2">S2</div>
          <div class="c-set" id="h3">S3</div>
          <div class="c-pts">PTS</div>
        </div>

        <div class="r team a" id="rowA">
          <span class="stripe"></span>
          <div class="c-name" id="nameA"></div>
          <div class="c-set" id="s1a">{{ match.set1_a }}</div>
          <div class="c-set" id="s2a">{{ match.set2_a }}</div>
          <div class="c-set" id="s3a">{{ match.set3_a }}</div>
          <div class="c-pts" id="ptsA">0</div>
        </div>

        <div class="r team b" id="rowB">
          <span class="stripe"></span>
          <div class="c-name" id="nameB"></div>
          <div class="c-set" id="s1b">{{ match.set1_b }}</div>
          <div class="c-set" id="s2b">{{ match.set2_b }}</div>
          <div class="c-set" id="s3b">{{ match.set3_b }}</div>
          <div class="c-pts" id="ptsB">0</div>
        </div>
      </div>
    </div>
  </div>

  {{ initial_state|json_script:"initial-state" }}

<script>
(function () {
  "use strict";

  var code = "{{ match.code|escapejs }}";
  var root = document.documentElement;

  function $(id) { return document.getElementById(id); }

  /* ---------- Parámetros opcionales ---------- */
  var params = {};
  location.search.replace(/^\?/, "").split("&").forEach(function (kv) {
    if (!kv) return;
    var p = kv.split("=");
    try {
      params[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || "").replace(/\+/g, " "));
    } catch (e) {}
  });
  function num(v, def, min, max) {
    var n = parseFloat(v);
    if (isNaN(n)) return def;
    return Math.min(max, Math.max(min, n));
  }
  root.style.setProperty("--top", num(params.top, 190, 0, 1600));
  root.style.setProperty("--scale", num(params.scale, 1, 0.5, 1.1));
  if (params.logo === "0") document.body.classList.add("no-logo");
  if (params.league === "0") document.body.classList.add("no-league");
  if (params.pos === "bottom") $("ov").classList.add("at-bottom");

  /* ---------- Estado inicial (servidor) ---------- */
  var state = {};
  try { state = JSON.parse($("initial-state").textContent) || {}; } catch (e) { state = {}; }

  var lastPtsA = null, lastPtsB = null;

  function toInt(v) { var n = parseInt(v, 10); return isNaN(n) ? 0 : n; }
  function isOff(v) { return v === false || v === 0 || v === "0"; }

  function isSetWon(a, b) {
    if ((a >= 6 || b >= 6) && Math.abs(a - b) >= 2) return true;
    if ((a === 7 && b === 6) || (a === 6 && b === 7)) return true;
    return false;
  }

  function flash(el) {
    el.classList.add("flash");
    setTimeout(function () { el.classList.remove("flash"); }, 600);
  }

  /* Nombre de pareja: "Pérez / Gómez" -> una línea por jugador */
  function renderTeam(cell, teamName, isWinnerRow) {
    var players = String(teamName || "").split("/").map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length; });
    if (!players.length) players = ["—"];
    var key = players.join("|");
    if (cell.getAttribute("data-key") !== key) {
      cell.innerHTML = "";
      players.forEach(function (p) {
        var span = document.createElement("span");
        span.className = "player";
        span.appendChild(document.createTextNode(p));
        var mark = document.createElement("span");
        mark.className = "win-mark";
        mark.appendChild(document.createTextNode("▲"));
        span.appendChild(mark);
        cell.appendChild(span);
      });
      cell.setAttribute("data-key", key);
    }
    fitPlayers(cell);
  }

  /* Achica la letra hasta que el nombre entre; si igual no entra, permite 2 líneas */
  function fitPlayers(cell) {
    var cs = window.getComputedStyle(cell);
    var avail = cell.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var players = cell.querySelectorAll(".player");
    for (var i = 0; i < players.length; i++) {
      var el = players[i];
      el.style.fontSize = "";
      el.classList.remove("wrap");
      var size = 5;            // rem (ver overlay.css)
      while (el.scrollWidth > avail + 1 && size > 3.2) {
        size -= 0.2;
        el.style.fontSize = size + "rem";
      }
      if (el.scrollWidth > avail + 1) el.classList.add("wrap");
    }
  }

  function render() {
    var s = state;
    var ta = s.team_a || "Equipo A";
    var tb = s.team_b || "Equipo B";
    var finished = !!s.finished;
    var winner = finished ? (s.winner || "") : "";
    var aWins = finished && winner !== "" && winner === ta;
    var bWins = finished && winner !== "" && winner === tb;

    $("rowA").classList.toggle("winner", aWins);
    $("rowB").classList.toggle("winner", bWins);
    $("rowA").classList.toggle("loser", bWins);
    $("rowB").classList.toggle("loser", aWins);

    renderTeam($("nameA"), ta);
    renderTeam($("nameB"), tb);

    var sets = Array.isArray(s.sets) ? s.sets : [
      { a: s.set1_a, b: s.set1_b }, { a: s.set2_a, b: s.set2_b }, { a: s.set3_a, b: s.set3_b }
    ];
    var current = Math.min(3, Math.max(1, toInt(s.current_set) || 1));

    for (var i = 1; i <= 3; i++) {
      var set = sets[i - 1] || {};
      var a = toInt(set.a), b = toInt(set.b);
      var ca = $("s" + i + "a"), cb = $("s" + i + "b"), h = $("h" + i);
      ca.textContent = a;
      cb.textContent = b;

      var isCurrent = !finished && i === current;
      var played = i <= current || a > 0 || b > 0;
      var won = isSetWon(a, b);

      [ca, cb, h].forEach(function (el) {
        el.classList.toggle("current", isCurrent);
        el.classList.toggle("played", played);
      });
      ca.classList.toggle("won", won && a > b);
      cb.classList.toggle("won", won && b > a);
    }

    /* Puntos del game actual: se muestran tal cual los manda el panel (0/15/30/40/AD o tie-break) */
    var cg = s.current_game || { mode: "regular", a: 0, b: 0 };
    var hidePts = finished || isOff(s.show_points) || isOff(s.showPoints);
    document.body.classList.toggle("pts-hidden", hidePts);

    var pa = (cg.a === undefined || cg.a === null || cg.a === "") ? 0 : cg.a;
    var pb = (cg.b === undefined || cg.b === null || cg.b === "") ? 0 : cg.b;
    $("ptsA").textContent = pa;
    $("ptsB").textContent = pb;
    if (lastPtsA !== null && String(pa) !== String(lastPtsA)) flash($("ptsA"));
    if (lastPtsB !== null && String(pb) !== String(lastPtsB)) flash($("ptsB"));
    lastPtsA = pa; lastPtsB = pb;

    var st = $("status");
    var text = "SET " + current, cls = "status";
    if (cg.mode === "tiebreak") { text = "TIE-BREAK"; cls += " tb"; }
    if (cg.mode === "super_tb") { text = "SÚPER TIE-BREAK"; cls += " tb"; }
    if (finished) { text = "FINAL"; cls += " final"; }
    st.textContent = text;
    st.className = cls;
  }

  function merge(data) {
    if (!data || typeof data !== "object" || data.error) return;
    for (var k in data) {
      if (Object.prototype.hasOwnProperty.call(data, k)) state[k] = data[k];
    }
    render();
  }

  /* ---------- Tiempo real: mismo WebSocket que la vista pública + polling de respaldo ---------- */
  var pollTimer = null;

  function poll() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/" + encodeURIComponent(code) + "/live/?t=" + Date.now(), true);
    xhr.onload = function () {
      if (xhr.status === 200) { try { merge(JSON.parse(xhr.responseText)); } catch (e) {} }
    };
    xhr.send();
  }
  function startPolling() { if (!pollTimer) pollTimer = setInterval(poll, 3000); }
  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  function connect() {
    var proto = location.protocol === "https:" ? "wss" : "ws";
    var socket;
    try {
      socket = new WebSocket(proto + "://" + location.host + "/ws/match/" + code + "/");
    } catch (e) {
      startPolling(); setTimeout(connect, 5000); return;
    }
    socket.onopen = function () { stopPolling(); poll(); };
    socket.onmessage = function (ev) {
      try { var raw = JSON.parse(ev.data); merge(raw.payload || raw); } catch (e) {}
    };
    socket.onclose = function () { startPolling(); setTimeout(connect, 3000); };
    socket.onerror = function () { try { socket.close(); } catch (e) {} };
  }

  window.addEventListener("resize", render);
  render();
  connect();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
})();
</script>
</body>
</html>
