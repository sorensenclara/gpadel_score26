<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador overlay {{ match.code }} — 9:16</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1b1f; font-family: -apple-system, Helvetica, Arial, sans-serif; color: #eee; }
    .page { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; box-sizing: border-box; min-height: 100%; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: center; font-size: 14px; }
    .bar code { background: #2c2c33; padding: 2px 6px; border-radius: 4px; }
    .bar label { cursor: pointer; }
    /* Marco 9:16 que representa el video 1080x1920 */
    .frame { position: relative; height: calc(100vh - 110px); aspect-ratio: 9 / 16; max-width: calc(100vw - 32px); border-radius: 18px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
    /* "Cámara": cancha de pádel dibujada */
    .court { position: absolute; inset: 0;
      background:
        linear-gradient(180deg, #7aa7c9 0%, #9cc1dc 22%, #3f6f93 22.2%, #2f5f86 100%); }
    .court::before { content: ""; position: absolute; left: 8%; right: 8%; top: 38%; bottom: 4%;
      background: #2d6a9f; border: 4px solid #fff; transform: perspective(600px) rotateX(38deg); transform-origin: bottom; }
    .court::after { content: ""; position: absolute; left: 4%; right: 4%; top: 52%; height: 6%;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,.85) 0 2px, transparent 2px 10px); border-top: 4px solid #fff; }
    /* El overlay se renderiza a 1080x1920 reales y se escala para entrar en el marco */
    .ovwrap { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    .ovwrap iframe { width: 1080px; height: 1920px; border: 0; background: transparent; display: block; }
    /* Interfaz simulada de Instagram Live */
    .ig { position: absolute; inset: 0; pointer-events: none; font-size: 13px; }
    .ig .top { position: absolute; top: 2.2%; left: 4%; right: 4%; display: flex; align-items: center; gap: 8px; }
    .ig .avatar { width: 30px; height: 30px; border-radius: 50%; background: #ddd; }
    .ig .live { background: linear-gradient(90deg,#d6249f,#fd5949); color: #fff; font-weight: 700; padding: 3px 7px; border-radius: 4px; font-size: 11px; }
    .ig .views { background: rgba(0,0,0,.45); color: #fff; padding: 3px 7px; border-radius: 4px; font-size: 11px; }
    .ig .close { margin-left: auto; color: #fff; font-size: 20px; }
    .ig .bottom { position: absolute; bottom: 2.5%; left: 4%; right: 4%; height: 34px; border: 1px solid rgba(255,255,255,.7); border-radius: 18px; color: rgba(255,255,255,.8); display: flex; align-items: center; padding: 0 12px; }
    .ig .comments { position: absolute; bottom: 9%; left: 4%; color: #fff; text-shadow: 0 1px 2px #000; line-height: 1.6; }
    .safe { position: absolute; left: 0; right: 0; top: 0; height: 9.9%; border-bottom: 2px dashed rgba(255,80,80,.9); pointer-events: none; }
    .hide-ig .ig, .hide-safe .safe { display: none; }
  </style>
</head>
<body>
  <div class="page" id="page">
    <div class="bar">
      <span>Simulador 9:16 (1080×1920) — overlay: <code>{{ overlay_url }}</code></span>
      <label><input type="checkbox" id="tIg" checked> Interfaz de Instagram</label>
      <label><input type="checkbox" id="tSafe" checked> Zona de seguridad superior</label>
      <a href="{{ overlay_url }}" target="_blank" style="color:#7fd3a0">Abrir overlay solo</a>
    </div>
    <div class="frame" id="frame">
      <div class="court"></div>
      <div class="ovwrap" id="ovwrap">
        <iframe src="{{ overlay_url }}" allowtransparency="true" title="overlay"></iframe>
      </div>
      <div class="safe"></div>
      <div class="ig">
        <div class="top"><span class="avatar"></span><b style="color:#fff">ligapadelsanca</b><span class="live">EN VIVO</span><span class="views">👁 128</span><span class="close">×</span></div>
        <div class="comments"><b>juli.padel</b> vamos chicas!!<br><b>sanca.club</b> 🔥🔥</div>
        <div class="bottom">Comentar…</div>
      </div>
    </div>
  </div>
<script>
  function fit() {
    var frame = document.getElementById("frame");
    document.getElementById("ovwrap").style.transform = "scale(" + (frame.clientWidth / 1080) + ")";
  }
  window.addEventListener("resize", fit); fit();
  document.getElementById("tIg").onchange = function (e) { document.getElementById("page").classList.toggle("hide-ig", !e.target.checked); };
  document.getElementById("tSafe").onchange = function (e) { document.getElementById("page").classList.toggle("hide-safe", !e.target.checked); };
</script>
</body>
</html>
