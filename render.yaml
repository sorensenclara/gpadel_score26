services:
  - type: web
    name: gpadel-score26
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "daphne padelboard.asgi:application -b 0.0.0.0 -p $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
